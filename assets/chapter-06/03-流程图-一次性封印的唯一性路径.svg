<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100d"/>
      <stop offset="0.55" stop-color="#0d1b15"/>
      <stop offset="1" stop-color="#020605"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d887"/>
      <stop offset="0.5" stop-color="#b98737"/>
      <stop offset="1" stop-color="#6d481c"/>
    </linearGradient>
    <style>
      .title { font: 700 34px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #f3d58a; letter-spacing: 2px; }
      .label { font: 700 24px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #f4d98d; }
      .body { font: 400 20px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #d3c39b; }
      .small { font: 400 18px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #ad9b70; }
      .card { fill: #0a1712; stroke: #6f5224; stroke-width: 2; }
      .card.highlight { fill: #101d16; stroke: #c59b43; stroke-width: 3; }
      .number { fill: #111f17; stroke: url(#gold); stroke-width: 3; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 790 C260 720 440 850 730 775 S1240 700 1600 790" fill="none" stroke="#183126" stroke-width="3" opacity="0.65"/>
  <path d="M0 835 C300 760 480 875 780 810 S1260 750 1600 840" fill="none" stroke="#12251d" stroke-width="2" opacity="0.8"/>

  <text x="800" y="68" text-anchor="middle" class="title">一次性封印如何保持权利唯一</text>
  <text x="800" y="105" text-anchor="middle" class="small">旧权利被关闭，新权利被定义；封印解决的是重复使用</text>

  <text x="160" y="175" text-anchor="middle" class="small">01</text>
  <rect x="40" y="205" width="240" height="330" rx="18" class="card"/>
  <circle cx="160" cy="275" r="42" class="number"/>
  <text x="160" y="288" text-anchor="middle" class="label" font-size="30">1</text>
  <text x="160" y="365" text-anchor="middle" class="label">定义封印</text>
  <text x="160" y="415" text-anchor="middle" class="body">资产分配关联</text>
  <text x="160" y="450" text-anchor="middle" class="body">Bitcoin UTXO</text>
  <text x="160" y="500" text-anchor="middle" class="small">建立控制位置</text>

  <text x="480" y="175" text-anchor="middle" class="small">02</text>
  <rect x="360" y="205" width="240" height="330" rx="18" class="card"/>
  <circle cx="480" cy="275" r="42" class="number"/>
  <text x="480" y="288" text-anchor="middle" class="label" font-size="30">2</text>
  <text x="480" y="365" text-anchor="middle" class="label">花费旧 UTXO</text>
  <text x="480" y="415" text-anchor="middle" class="body">持有者花费</text>
  <text x="480" y="450" text-anchor="middle" class="body">旧权利位置</text>
  <text x="480" y="500" text-anchor="middle" class="small">交易成为见证</text>

  <text x="800" y="175" text-anchor="middle" class="small">03</text>
  <rect x="680" y="205" width="240" height="330" rx="18" class="card highlight"/>
  <circle cx="800" cy="275" r="42" class="number"/>
  <text x="800" y="288" text-anchor="middle" class="label" font-size="30">3</text>
  <text x="800" y="365" text-anchor="middle" class="label">关闭旧封印</text>
  <text x="800" y="415" text-anchor="middle" class="body">承诺锚定到</text>
  <text x="800" y="450" text-anchor="middle" class="body">Bitcoin 交易</text>
  <text x="800" y="500" text-anchor="middle" class="small">只能关闭一次</text>

  <text x="1120" y="175" text-anchor="middle" class="small">04</text>
  <rect x="1000" y="205" width="240" height="330" rx="18" class="card"/>
  <circle cx="1120" cy="275" r="42" class="number"/>
  <text x="1120" y="288" text-anchor="middle" class="label" font-size="30">4</text>
  <text x="1120" y="365" text-anchor="middle" class="label">创建新封印</text>
  <text x="1120" y="415" text-anchor="middle" class="body">新分配关联</text>
  <text x="1120" y="450" text-anchor="middle" class="body">新的 Bitcoin 输出</text>
  <text x="1120" y="500" text-anchor="middle" class="small">交给下一位持有人</text>

  <text x="1440" y="175" text-anchor="middle" class="small">05</text>
  <rect x="1320" y="205" width="240" height="330" rx="18" class="card highlight"/>
  <circle cx="1440" cy="275" r="42" class="number"/>
  <text x="1440" y="288" text-anchor="middle" class="label" font-size="30">5</text>
  <text x="1440" y="365" text-anchor="middle" class="label">验证唯一性</text>
  <text x="1440" y="415" text-anchor="middle" class="body">检查关闭、承诺</text>
  <text x="1440" y="450" text-anchor="middle" class="body">规则与历史</text>
  <text x="1440" y="500" text-anchor="middle" class="small">冲突路径不被接受</text>

  <rect x="285" y="650" width="1030" height="105" rx="18" fill="#0c1712" stroke="#6f5224" stroke-width="2"/>
  <text x="800" y="695" text-anchor="middle" class="label">封印的边界</text>
  <text x="800" y="732" text-anchor="middle" class="body">证明权利不能重复使用 · 不证明价格、储备或发行方信用</text>

  <text x="40" y="855" class="small">RGB Value Analysis · 第 06 篇</text>
</svg>
